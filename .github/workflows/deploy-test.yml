
name: GrensCheck test publiceren

on:
  push:
    branches:
      - test

jobs:
  deploy-test:
    runs-on: ubuntu-latest

    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pakketten installeren
        run: npm ci

      - name: Testversie bouwen
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_APP_ENV: test

      - name: Testwebsite publiceren
        run: npx eas-cli@latest deploy --alias grenscheck-test --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
